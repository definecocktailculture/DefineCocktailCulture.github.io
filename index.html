:root{
  --bg:#080808;
  --surface:#111010;
  --surface-2:#1a1717;
  --rose:#c08a8d;
  --rose-soft:#e5c3c5;
  --ink:#f5efe9;
  --muted:#aaa09d;
  --line:rgba(192,138,141,.26);
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#080808;
    --surface:#111010;
    --ink:#f5efe9;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',system-ui,sans-serif
}

.font-serif{
  font-family:'Cormorant Garamond',Georgia,serif
}

.eyebrow{
  letter-spacing:.34em;
  text-transform:uppercase;
  font-size:11px;
  font-weight:600;
  color:var(--rose)
}

.hairline{
  height:1px;
  background:var(--line)
}

.gold-grad{
  background:linear-gradient(135deg,#f0d7d8,#c08a8d 42%,#765050 72%,#e6c8ca)
}

.text-grad{
  background:linear-gradient(120deg,#fff 10%,#e8c7c9 45%,#c08a8d 78%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

input,select,textarea{
  font-family:inherit
}

.field{
  width:100%;
  background:#171414;
  border:1px solid #2b2424;
  color:var(--ink);
  padding:14px 15px;
  border-radius:2px;
  outline:none
}

.field:focus{
  border-color:var(--rose);
  box-shadow:0 0 0 3px rgba(192,138,141,.14)
}

.chip{
  border:1px solid #312a2a;
  padding:9px 14px;
  border-radius:999px;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  background:transparent;
  color:#d8cfcc
}

.chip.active{
  background:var(--rose);
  color:#171212;
  border-color:var(--rose);
  font-weight:700
}

.btn-rose{
  background:var(--rose);
  color:#171212;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase
}

.btn-rose:hover{
  background:#d3a2a5
}

.btn-line{
  border:1px solid rgba(245,239,233,.35);
  letter-spacing:.14em;
  text-transform:uppercase
}

.btn-line:hover{
  border-color:var(--rose);
  color:var(--rose-soft)
}

.card-hover{
  transition:transform .35s ease,border-color .35s ease
}

.card-hover:hover{
  transform:translateY(-4px);
  border-color:rgba(192,138,141,.5)
}

.hover\:border-\[var\(--rose\)\]:hover{
  border-color: var(--rose);
}

.hover\:text-\[var\(--rose-soft\)\]:hover{
  color: var(--rose-soft);
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px){
  .sm\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:h-\[62vh\]{
    height: 62vh;
  }

  .sm\:w-auto{
    width: auto;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:p-10{

  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .sm\:pt-24{
    padding-top: 6rem;
  }

  .sm\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }

  .sm\:text-6xl{
    font-size: 3.75rem;
    line-height: 1;
  }

  .sm\:text-7xl{
    font-size: 4.5rem;
    line-height: 1;
  }

  .sm\:text-8xl{
    font-size: 6rem;
    line-height: 1;
  }

  .sm\:text-\[190px\]{
    font-size: 190px;
  }

  .sm\:text-\[48px\]{
    font-size: 48px;
  }
}

@media (min-width: 768px){
  .md\:flex{
    display: flex;
  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{

  }

  }

  .lg\:hidden{
    display: none;
  }

  .lg\:w-\[320px\]{
    width: 320px;
  }

  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1fr_1\.1fr\]{
    grid-template-columns: 1fr 1.1fr;

  }
}

  .xl\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
